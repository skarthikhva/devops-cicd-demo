apiVersion: v1
data:
  devops-demo-dashboard.json: |
    {
      "title": "DevOps Demo",
      "uid": "devops-demo",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total Submissions",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "app_submissions_current{application=\"devops-demo\"}", "legendFormat": "submissions" }
          ],
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] }
        },
        {
          "id": 2,
          "title": "Submission Rate (per min)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 10, "x": 6, "y": 0 },
          "targets": [
            { "expr": "rate(app_submissions_total{application=\"devops-demo\"}[5m]) * 60", "legendFormat": "submissions/min" }
          ]
        },
        {
          "id": 3,
          "title": "Pod Up",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "targets": [
            { "expr": "up{job=\"devops-demo\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "JVM Heap Used",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 6 },
          "targets": [
            { "expr": "jvm_memory_used_bytes{application=\"devops-demo\", area=\"heap\"}", "legendFormat": "{{id}}" }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Request Rate by Status",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 6 },
          "targets": [
            { "expr": "sum by (status) (rate(http_server_requests_seconds_count{application=\"devops-demo\"}[5m]))", "legendFormat": "{{status}}" }
          ]
        },
        {
          "id": 6,
          "title": "p95 HTTP Latency",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 6 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"devops-demo\"}[5m])))", "legendFormat": "p95" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 7,
          "title": "App Logs",
          "type": "logs",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            { "expr": "{app=\"devops-demo\"}", "datasource": { "type": "loki", "uid": "loki" } }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: devops-demo-dashboard
  namespace: monitoring
