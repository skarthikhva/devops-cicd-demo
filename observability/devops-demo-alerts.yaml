# PrometheusRule consumed by the kube-prometheus-stack Prometheus Operator (picked up
# automatically -- ruleSelectorNilUsesHelmValues is set to false in
# kube-prometheus-stack-values.yaml, so Prometheus watches PrometheusRules cluster-wide).
#
# Apply with: kubectl apply -f observability/devops-demo-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-demo-alerts
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: devops-demo
      rules:
        - alert: DevopsDemoDown
          expr: up{job="devops-demo"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "devops-demo pod {{ $labels.pod }} is down"
            description: "Prometheus has not been able to scrape {{ $labels.pod }} for 1 minute."

        - alert: DevopsDemoHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{application="devops-demo", status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{application="devops-demo"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "devops-demo 5xx error rate above 5%"
            description: "More than 5% of requests to devops-demo have returned a 5xx status over the last 5 minutes."

        - alert: DevopsDemoHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="devops-demo"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "devops-demo p95 latency above 1s"
            description: "p95 request latency for devops-demo has been above 1 second for 5 minutes."
